name: LiftFuel
options:
  bundleIdPrefix: com.liftfuel
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: targeted
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES

targets:
  LiftFuel:
    type: application
    platform: iOS
    sources:
      - path: LiftFuel
      - path: Shared
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    info:
      path: LiftFuel/Resources/Info.plist
      properties:
        CFBundleDisplayName: "Lift & Fuel"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
          UIImageName: LaunchLogo
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: com.liftfuel.app
            CFBundleURLSchemes:
              - liftfuel
        NSCameraUsageDescription: "Take a photo of your meal so the coach can estimate calories and macros."
        NSPhotoLibraryUsageDescription: "Choose a meal photo so the coach can estimate calories and macros."
        NSHealthShareUsageDescription: "Read your body weight and step count to keep your nutrition targets accurate."
        NSHealthUpdateUsageDescription: "Save your workouts and body weight to Apple Health."
        ClaudeDevAPIKey: $(ANTHROPIC_DEV_API_KEY)
    entitlements:
      path: LiftFuel/Resources/LiftFuel.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.security.application-groups:
          - group.com.liftfuel.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liftfuel.app
        PRODUCT_NAME: LiftFuel
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_PREVIEWS: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Lift & Fuel"
    dependencies:
      - target: LiftFuelWidgets
        embed: true

  LiftFuelWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: LiftFuelWidgets
      - path: Shared
    info:
      path: LiftFuelWidgets/Info.plist
      properties:
        CFBundleDisplayName: "Lift & Fuel"
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: LiftFuelWidgets/LiftFuelWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.liftfuel.app
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.liftfuel.app.widgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  LiftFuelTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LiftFuelTests
    dependencies:
      - target: LiftFuel
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.liftfuel.app.tests

  LiftFuelUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: LiftFuelUITests
    dependencies:
      - target: LiftFuel
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.liftfuel.app.uitests
        TEST_TARGET_NAME: LiftFuel

schemes:
  LiftFuel:
    build:
      targets:
        LiftFuel: all
        LiftFuelWidgets: all
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - LiftFuelTests
        - LiftFuelUITests
    archive:
      config: Release
